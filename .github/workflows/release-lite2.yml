name: Build WeKnora Lite for Intel Mac

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build version (e.g. v0.2.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-desktop-app:
    name: Build Intel Mac App

    runs-on: macos-15-intel

    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show build environment
        run: |
          echo "Architecture:"
          uname -m
          echo "macOS:"
          sw_vers
          echo "Go:"
          go version
          echo "Node:"
          node --version

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn

          eval "$(./scripts/get_version.sh env)"

          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"

          export CGO_CFLAGS="-Wno-deprecated-declarations"
          export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"

          bash ./scripts/check-license-bundle.sh

          cd cmd/desktop

          wails build -clean \
            -tags "sqlite_fts5" \
            -platform darwin/amd64 \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      - name: Package macOS App
        shell: bash
        run: |
          APP_BUNDLE="WeKnora Lite.app"
          SRC="cmd/desktop/build/bin/${APP_BUNDLE}"
          RESOURCES="${SRC}/Contents/Resources"

          test -d "${SRC}"

          mkdir -p "${RESOURCES}/config"
          mkdir -p "${RESOURCES}/migrations/sqlite"

          bash ./scripts/copy-licenses.sh "${RESOURCES}"

          if [ -f .env.lite.example ]; then
            cp .env.lite.example "${RESOURCES}/.env"
          fi

          if [ -d migrations/sqlite ]; then
            cp -r migrations/sqlite/* \
              "${RESOURCES}/migrations/sqlite/"
          fi

          if [ -d config ]; then
            cp -r config/* \
              "${RESOURCES}/config/"
          fi

          VERSION="${{ inputs.tag }}"
          DMG_NAME="WeKnora-Lite-App_${VERSION}_macOS_amd64"

          DMG_SRC="dmg_staging"
          rm -rf "${DMG_SRC}"
          mkdir -p "${DMG_SRC}"

          cp -R "${SRC}" "${DMG_SRC}/"
          ln -s /Applications "${DMG_SRC}/Applications"

          hdiutil create \
            -volname "WeKnora Lite" \
            -srcfolder "${DMG_SRC}" \
            -ov \
            -format UDZO \
            "${DMG_NAME}.dmg"

          shasum -a 256 \
            "${DMG_NAME}.dmg" \
            > "${DMG_NAME}.dmg.sha256"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: WeKnora-Lite-Intel-Mac
          path: |
            WeKnora-Lite-App_*.dmg
            WeKnora-Lite-App_*.dmg.sha256
          retention-days: 7
