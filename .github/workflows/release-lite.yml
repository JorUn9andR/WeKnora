name: Release Lite Binaries (Intel Mac, Windows, Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  # Build the frontend once and reuse it in all native Lite builds.
  build-frontend:
    name: Build Lite frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # Native CGO builds: Linux amd64 and Intel macOS amd64.
  build-unix-lite:
    name: Build Lite (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Install Linux CGO dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev

      - name: Verify build inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Go: $(go version)"
          echo "Target: ${{ matrix.goos }}/${{ matrix.goarch }}"
          test -f web/index.html
          test -f .env.lite.example
          test -f docs/LITE.md

      - name: Build Lite binary
        shell: bash
        run: |
          set -euo pipefail
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"

          LDFLAGS="-w -s $(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          if [ "${{ matrix.goos }}" = "darwin" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi

          go build \
            -tags "sqlite_fts5" \
            -ldflags="${LDFLAGS}" \
            -o WeKnora-lite \
            ./cmd/server

      - name: Package Lite archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="WeKnora-lite_${RELEASE_TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          DIST="dist/${ARCHIVE}"

          rm -rf "$DIST"
          mkdir -p "$DIST/web"

          cp WeKnora-lite "$DIST/"
          cp -R web/. "$DIST/web/"
          cp .env.lite.example "$DIST/"
          cp docs/LITE.md "$DIST/README.md"
          bash ./scripts/copy-licenses.sh "$DIST"

          if [ -d config ]; then
            cp -R config "$DIST/config"
          fi
          if [ -d migrations/sqlite ]; then
            mkdir -p "$DIST/migrations/sqlite"
            cp -R migrations/sqlite/. "$DIST/migrations/sqlite/"
          fi
          if [ -f deploy/weknora-lite.service ]; then
            cp deploy/weknora-lite.service "$DIST/"
          fi

          mkdir -p dist
          tar -czf "${DIST}.tar.gz" -C dist "$ARCHIVE"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"
          else
            sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"
          fi

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v7
        with:
          name: lite-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Windows needs a UCRT MinGW compiler compatible with the prebuilt DuckDB
  # static library. The sqlite-vec CGO binding also needs sqlite3.h.
  build-windows-lite:
    name: Build Lite (windows-amd64)
    needs: build-frontend
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-sqlite3

      # Install and check the SQLite header from inside the UCRT64 environment.
      # This avoids guessing whether MSYS2 lives under C:\msys64 or RUNNER_TEMP.
      - name: Install and verify SQLite development header
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-sqlite3
          test -f /ucrt64/include/sqlite3.h
          printf 'WEKNORA_SQLITE_INCLUDE=%s\n' "$(cygpath -w /ucrt64/include)" >> "$GITHUB_ENV"
          echo "SQLite header found: /ucrt64/include/sqlite3.h"

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      # DuckDB's bundled Windows static library is built with UCRT MinGW.
      # Use the known compatible GCC 14.2 UCRT distribution rather than the
      # runner's default MSYS2 GCC, which can be a newer incompatible version.
      - name: Install compatible GCC 14.2 UCRT toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mingw-gcc-14.2-ucrt.7z'
          $gccRoot = Join-Path $env:RUNNER_TEMP 'mingw-gcc-14.2-ucrt'
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/14.2.0-rt_v12-rev0/x86_64-14.2.0-release-posix-seh-ucrt-rt_v12-rev0.7z'

          Invoke-WebRequest -Uri $url -OutFile $archive

          $sevenZip = (Get-Command '7z.exe' -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $candidate = 'C:\Program Files\7-Zip\7z.exe'
            if (Test-Path $candidate) {
              $sevenZip = $candidate
            }
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress
            $sevenZip = (Get-Command '7z.exe' -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) {
              foreach ($candidate in @(
                'C:\Program Files\7-Zip\7z.exe',
                'C:\Program Files (x86)\7-Zip\7z.exe'
              )) {
                if (Test-Path $candidate) {
                  $sevenZip = $candidate
                  break
                }
              }
            }
          }
          if (-not $sevenZip) {
            throw '7-Zip was not found; cannot extract the UCRT GCC archive.'
          }

          Remove-Item $gccRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $gccRoot | Out-Null
          & $sevenZip x $archive "-o$gccRoot" -y | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip extraction failed with exit code $LASTEXITCODE."
          }

          $gccItem = Get-ChildItem -Path $gccRoot -Filter 'gcc.exe' -File -Recurse | Select-Object -First 1
          if (-not $gccItem) {
            throw "gcc.exe was not found under $gccRoot after extraction."
          }
          $gccBin = $gccItem.Directory.FullName
          $gxx = Join-Path $gccBin 'g++.exe'
          if (-not (Test-Path $gxx)) {
            throw "g++.exe was not found beside $($gccItem.FullName)."
          }

          $gccVersion = (& $gccItem.FullName -dumpfullversion -dumpversion | Out-String).Trim()
          if (-not $gccVersion.StartsWith('14.2')) {
            throw "Expected GCC 14.2, found '$gccVersion'."
          }

          "WEKNORA_GCC_BIN=$gccBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gccBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "GCC version: $gccVersion"
          Write-Host "GCC directory: $gccBin"

      - name: Verify Windows build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'web\index.html')) {
            throw 'Frontend artifact web/index.html is missing.'
          }
          if (-not (Test-Path '.env.lite.example')) {
            throw '.env.lite.example is missing.'
          }
          if (-not (Test-Path $env:WEKNORA_SQLITE_INCLUDE)) {
            throw "SQLite include directory does not exist: $env:WEKNORA_SQLITE_INCLUDE"
          }
          if (-not (Test-Path (Join-Path $env:WEKNORA_SQLITE_INCLUDE 'sqlite3.h'))) {
            throw "sqlite3.h is missing from $env:WEKNORA_SQLITE_INCLUDE"
          }
          go version
          & (Join-Path $env:WEKNORA_GCC_BIN 'gcc.exe') --version
          Write-Host "SQLite include: $env:WEKNORA_SQLITE_INCLUDE"

      - name: Build Windows Lite binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CC = Join-Path $env:WEKNORA_GCC_BIN 'gcc.exe'
          $env:CXX = Join-Path $env:WEKNORA_GCC_BIN 'g++.exe'
          $env:CGO_ENABLED = '1'
          $sqliteInclude = $env:WEKNORA_SQLITE_INCLUDE.Replace('\', '/')
          $env:CGO_CFLAGS = "-Wno-deprecated-declarations -idirafter $sqliteInclude"
          $env:EDITION = 'lite'
          $env:GOLANG_PROTOBUF_REGISTRATION_CONFLICT = 'warn'

          $version = 'unknown'
          if (Test-Path 'VERSION') {
            $version = (Get-Content 'VERSION' -Raw).Trim()
          }
          $commitId = $env:GITHUB_SHA.Substring(0, 7)
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $goVersion = (go version | Out-String).Trim()

          $ldflags = @(
            '-w -s'
            "-X 'github.com/Tencent/WeKnora/internal/handler.Version=$version'"
            "-X 'github.com/Tencent/WeKnora/internal/handler.Edition=lite'"
            "-X 'github.com/Tencent/WeKnora/internal/handler.CommitID=$commitId'"
            "-X 'github.com/Tencent/WeKnora/internal/handler.BuildTime=$buildTime'"
            "-X 'github.com/Tencent/WeKnora/internal/handler.GoVersion=$goVersion'"
            "-X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          ) -join ' '

          Write-Host "CC=$env:CC"
          Write-Host "CXX=$env:CXX"
          Write-Host "CGO_CFLAGS=$env:CGO_CFLAGS"
          & go build -tags sqlite_fts5 -ldflags $ldflags -o WeKnora-lite.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) {
            throw "Go build failed with exit code $LASTEXITCODE."
          }

      - name: Prepare Windows Lite archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "WeKnora-lite_${env:RELEASE_TAG}_windows_amd64"
          $distRoot = Join-Path $PWD 'dist'
          $distDir = Join-Path $distRoot $archiveName
          $webDir = Join-Path $distDir 'web'

          Remove-Item $distDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null
          Copy-Item 'WeKnora-lite.exe' $distDir
          Copy-Item '.env.lite.example' $distDir
          Copy-Item 'docs\LITE.md' (Join-Path $distDir 'README.md')
          Copy-Item 'web\*' $webDir -Recurse -Force

          if (Test-Path 'config') {
            Copy-Item 'config' (Join-Path $distDir 'config') -Recurse -Force
          }
          if (Test-Path 'migrations\sqlite') {
            $migrationDir = Join-Path $distDir 'migrations\sqlite'
            New-Item -ItemType Directory -Force -Path $migrationDir | Out-Null
            Copy-Item 'migrations\sqlite\*' $migrationDir -Recurse -Force
          }

      - name: Copy Windows license notices and source archives
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/copy-licenses.sh "dist/WeKnora-lite_${RELEASE_TAG}_windows_amd64"

      - name: Create Windows ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "WeKnora-lite_${env:RELEASE_TAG}_windows_amd64"
          $zipPath = Join-Path 'dist' "$archiveName.zip"
          $distDir = Join-Path 'dist' $archiveName
          Compress-Archive -Path $distDir -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName.zip" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii

      - name: Upload Windows Lite artifact
        uses: actions/upload-artifact@v7
        with:
          name: lite-windows-amd64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # Publish only the three Lite CLI targets built above.
  release:
    name: Publish Lite release
    needs:
      - build-unix-lite
      - build-windows-lite
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lite-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          test -n "$(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cat > notes.md <<EOF
          ## WeKnora Lite ${RELEASE_TAG}

          Lite single-binary packages using SQLite (FTS5 + sqlite-vec) and the in-memory queue.
          This release contains CLI/server Lite packages only; it does not contain Wails desktop applications.

          | File | Platform |
          |---|---|
          | WeKnora-lite_*_darwin_amd64.tar.gz | macOS Intel (x86_64) |
          | WeKnora-lite_*_windows_amd64.zip | Windows x86_64 |
          | WeKnora-lite_*_linux_amd64.tar.gz | Linux x86_64 |

          Archives include the Lite binary, frontend files, .env.lite.example, license notices/source archives, and configuration/migrations when present.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "WeKnora Lite $RELEASE_TAG" \
              --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "WeKnora Lite $RELEASE_TAG" \
              --notes-file notes.md
          fi
