name: Release Lite Binaries

on:
  # push:
  #   tags:
  #     - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

concurrency:
  group: release-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Wails v2.17.1+ requires Go >= 1.26
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # ─────────────────────────────────────────────
  # 1. Build frontend once
  # ─────────────────────────────────────────────

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1


  # ─────────────────────────────────────────────
  # 2a. Build Web CLI Binary
  # ─────────────────────────────────────────────

  build-binary:
    needs: build-frontend

    strategy:
      fail-fast: false

      matrix:
        include:

          # Linux x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64

          # Linux ARM64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64

          # macOS Intel
          - os: macos-15-intel
            goos: darwin
            goarch: amd64

          # macOS Apple Silicon
          - os: macos-15
            goos: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}

    env:
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Resolve version
        id: ver
        shell:
